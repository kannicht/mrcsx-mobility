name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type checking and integration tests
        run: npm run check

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag mrcsx-mobility:ci \
            .

      - name: Verify fail-closed container startup
        run: |
          STATUS=0

          OUTPUT=$(docker run --rm --network none \
            mrcsx-mobility:ci 2>&1) || STATUS=$?

          test "$STATUS" -eq 1

          grep -q "Invalid or missing OAuth configuration" <<< "$OUTPUT"

          echo "PASS: Container refuses to start without OAuth configuration"

      - name: Run Docker OAuth and Transitous smoke tests
        run: bash tests/docker/run.sh mrcsx-mobility:ci

      - name: Save tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: docker save -o mobility-image.tar mrcsx-mobility:ci

      - name: Upload tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobility-release-image
          path: mobility-image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish container
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/kannicht/mrcsx-mobility

    steps:
      - name: Download tested image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: mobility-release-image

      - name: Load Docker image
        run: docker load -i mobility-image.tar

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          IMAGE_VERSION=$(docker image inspect mrcsx-mobility:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')

          test "$VERSION" = "$IMAGE_VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish release image
        run: |
          docker tag mrcsx-mobility:ci "$IMAGE:$VERSION"
          docker tag mrcsx-mobility:ci "$IMAGE:sha-$GITHUB_SHA"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Release image information
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
