name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type checking and integration tests
        run: npm run check

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag mrcsx-mobility:ci \
            .

      - name: Start test container
        run: |
          docker run -d \
            --name mobility-ci \
            --init \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --memory=256m \
            --cpus=1 \
            --pids-limit=128 \
            -e MOBILITY_PUBLIC_HOST=mobility.mrcsx.de \
            -p 127.0.0.1:3100:3100 \
            mrcsx-mobility:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30)
          do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health
            then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint did not become available" >&2
          exit 1

      - name: Test container MCP endpoint
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { randomUUID } from "node:crypto";
          import {
            Client,
            StreamableHTTPClientTransport,
          } from "@modelcontextprotocol/client";

          const client = new Client({
            name: "mobility-ci",
            version: "0.1.0",
          });

          try {
            await client.connect(
              new StreamableHTTPClientTransport(
                new URL("http://127.0.0.1:3100/mcp"),
              ),
            );

            const { tools } = await client.listTools();

            assert.deepEqual(
              tools.map(tool => tool.name),
              ["mobility_ping"],
            );

            const nonce = randomUUID();

            const result = await client.callTool({
              name: "mobility_ping",
              arguments: { nonce },
            });

            assert.notEqual(result.isError, true);
            assert.equal(result.structuredContent?.nonce, nonce);
            assert.equal(result.structuredContent?.status, "ok");
            assert.equal(
              result.structuredContent?.service,
              "mrcsx-mobility",
            );

            console.log("Container MCP test passed");
          } finally {
            await client.close();
          }
          JS

      - name: Container logs
        if: always()
        run: docker logs mobility-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f mobility-ci || true

      - name: Save tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: docker save -o mobility-image.tar mrcsx-mobility:ci

      - name: Upload tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobility-release-image
          path: mobility-image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish container
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/kannicht/mrcsx-mobility

    steps:
      - name: Download tested image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: mobility-release-image

      - name: Load Docker image
        run: docker load -i mobility-image.tar

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          IMAGE_VERSION=$(docker image inspect mrcsx-mobility:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')

          test "$VERSION" = "$IMAGE_VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish release image
        run: |
          docker tag mrcsx-mobility:ci "$IMAGE:$VERSION"
          docker tag mrcsx-mobility:ci "$IMAGE:sha-$GITHUB_SHA"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Release image information
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
